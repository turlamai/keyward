name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: v0.13.0

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    env:
      # Production signing lights up as soon as the account-level secrets
      # exist (Developer ID p12 + App Store Connect API key) and applies to
      # every workflow run that has them. Credential contract:
      # DEVELOPER_ID_P12_B64 / DEVELOPER_ID_P12_PASSWORD / ASC_KEY_ID /
      # ASC_ISSUER_ID / ASC_KEY_P8_B64; see rivet docs/production-signing.md.
      MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
      # A tag push is a release: without credentials it must fail closed
      # instead of silently shipping ad-hoc signed artifacts.
      IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (pinned, matches the local release drills)
        run: raco pkg install --auto --no-docs crypto 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Version preflight (VERSION == rivet.rktd == tag == CHANGELOG)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # Release artifacts must never reuse compiled caches from another
      # commit (the v0.2.0 deb shipped an older engine than its tag);
      # clean forces the whole backend to recompile from this checkout.
      - name: Clean-build gate (issue #7)
        run: raco rivet clean
      - name: Provision Developer ID certificate
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          DEVELOPER_ID_P12_B64: ${{ secrets.DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN" $(security list-keychains | tr -d '"')
          rm -f "$P12"
          IDENTITY_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')"
          test -n "$IDENTITY_NAME"
          # rivet reads exactly these two (rivet docs/production-signing.md);
          # release defaults to production mode, so exporting them alone
          # flips packaging over once --development is dropped below.
          {
            echo "RIVET_MACOS_SIGN_IDENTITY=$IDENTITY_NAME"
            echo "RIVET_MACOS_NOTARY_PROFILE=ASC_NOTARY"
          } >> "$GITHUB_ENV"
      - name: Store notarytool keychain profile
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$P8"
          xcrun notarytool store-credentials ASC_NOTARY \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --key "$P8"
          rm -f "$P8"
      # DMG (human installer) + portable zip + launch smoke. rivet's own
      # per-platform update emission stays off: keyward signs ONE merged
      # update feed in the publish job (payback pattern) — the app itself
      # stays manual-update-only until the issue #15 ladder lands.
      # `raco rivet release` defaults to production packaging: with the
      # credentials exported above it Developer ID-signs, notarizes,
      # staples, and re-verifies inside rivet itself.
      - name: Release (DMG + portable zip, Developer ID + notarized)
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        run: raco rivet release --without-updates
      - name: Release (DMG + portable zip, ad-hoc dispatch smoke)
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE != 'true'
        run: raco rivet release --without-updates --development
      - name: Release requires signing credentials
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE == 'true'
        run: |
          echo "::error::Tag releases must be production-signed: set the macOS signing secrets (DEVELOPER_ID_P12_B64, DEVELOPER_ID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64) on this repository before tagging."
          exit 1
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          # rivet names the portable zip in family form already; only
          # the DMG lacks the architecture.
          mv "keyward-${VERSION}-macos.dmg" "keyward-${VERSION}-macos-${ARCH}.dmg"
          for f in keyward-*.dmg keyward-*.zip; do
            [ -f "$f" ] || continue
            [ -f "$f.sha256" ] || shasum -a 256 "$f" > "$f.sha256"
          done
      # The sbom/notices bodies stay in the CI artifact only; the
      # release carries installers and their sidecars, nothing else.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/keyward-*

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        shell: pwsh
        run: raco pkg install --auto --no-docs crypto 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      # WiX v5 is rivet's MSI toolchain (raco rivet release shells out to it).
      - name: Install WiX
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2
      - name: Version preflight (VERSION == rivet.rktd == tag == CHANGELOG)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # Clean-build gate — see the macOS leg (issue #7).
      - name: Clean-build gate (issue #7)
        shell: pwsh
        run: raco rivet clean
      # MSI (human installer) + portable zip + launch smoke — same merged
      # feed policy as the macOS leg (signed in the publish job).
      - name: Release (MSI + portable zip)
        shell: pwsh
        run: raco rivet release --without-updates --development
      - name: Family naming + checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # rivet names the MSI and portable zip in family form already;
          # give the SBOM the family name so it rides the release.
          mv sbom.cdx.json "keyward-${VERSION}-windows-x64.sbom.cdx.json"
          for f in keyward-*; do
            case "$f" in
              *.sha256) ;;
              # The sbom/wixpdb bodies stay unchecksummed; checksum what
              # users verify by hand (installers and their sidecars).
              *.sbom.cdx.json | *.wixpdb) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256";;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/keyward-*

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, racket-arch: x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, racket-arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      # The ref is a literal — `uses:` cannot expand ${{ env.RIVET_PIN }};
      # keep it in sync with RIVET_PIN above when bumping rivet.
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@v0.13.0
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own. crypto backs keyward's
      # Ed25519 key work.
      - name: Install Rivet (catalog) and backend packages
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Install GTK4, rpm and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libsecret-1-dev \
            libglib2.0-dev cmake ninja-build pkg-config file \
            rpm desktop-file-utils \
            xvfb dbus-x11 at-spi2-core python3-pyatspi
      - name: Version preflight (VERSION == rivet.rktd == tag == CHANGELOG)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # Clean-build gate — see the macOS leg (issue #7).
      - name: Clean-build gate (issue #7)
        run: raco rivet clean
      # tar.gz (portable) + deb + rpm + AppImage + portable zip + SBOM,
      # launch smoke included. The AppImage carries its own GTK4 dependency
      # closure; APPIMAGE_EXTRACT_AND_RUN lets appimagetool run on the
      # runner. AppImage entries feed the signed update feed (publish job).
      - name: Release (tar.gz + deb + rpm + AppImage + portable zip)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: raco rivet release --without-updates --development
      # Release acceptance (issue #7): open a synthetic disposable vault in
      # the packaged host and assert — through the accessibility tree —
      # that the sidebar lists its product; then relaunch with the vault
      # restored from the persisted config (the v0.2.0 restart wedge).
      - name: Release-acceptance smoke (synthetic vault, restart persistence)
        run: |
          set -euo pipefail
          HOST="$(find dist -type f -name RivetHost | head -n1)"
          if [ -z "$HOST" ]; then
            TAR="$(find dist -name 'keyward-*-linux-*.tar.gz' | head -n1)"
            test -n "$TAR" || { echo "no Linux bundle found in dist" >&2; exit 1; }
            mkdir -p "$RUNNER_TEMP/acceptance-bundle"
            tar -xzf "$TAR" -C "$RUNNER_TEMP/acceptance-bundle"
            HOST="$(find "$RUNNER_TEMP/acceptance-bundle" -type f -name RivetHost | head -n1)"
          fi
          test -n "$HOST" || { echo "RivetHost binary not found" >&2; exit 1; }
          chmod +x "$HOST"
          dbus-run-session -- bash scripts/release-acceptance.sh "$HOST"
      # Wraps the tar.gz payload into a Flatpak bundle from the flatpak/
      # manifest template (family contract: deb+rpm+AppImage+Flatpak+tar.gz).
      # The manifest's module closure covers the two NEEDED entries outside
      # the GNOME Platform runtime (liblz4.so.1, libtinfo.so.6). Like
      # deb/rpm, the flatpak install shape is manual-by-design. Runs before
      # Family naming so the bundle joins the checksum sweep.
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc covers the
          # ubuntu-built payload.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release.
          cp "dist/keyward-${VERSION}-linux-${ARCH}.tar.gz" .
          SHA="$(sha256sum "keyward-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${ARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.keyward.yml > site.jrtx.keyward.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.keyward.gen.yml
          flatpak build-bundle flatpak-repo \
            "keyward-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.keyward stable
          mv "keyward-${VERSION}-linux-${ARCH}.flatpak" dist/
          rm -rf flatpak-build flatpak-repo \
            "keyward-${VERSION}-linux-${ARCH}.tar.gz" site.jrtx.keyward.gen.yml
          test -f "dist/keyward-${VERSION}-linux-${ARCH}.flatpak"
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          mv sbom.cdx.json "keyward-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          for f in keyward-*; do
            case "$f" in
              *.sha256) ;;
              *.sbom.cdx.json) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/keyward-*

  publish:
    name: Publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # cp -R merges: release legs can leave a dist/keyward-linux-<arch>/
          # staging bundle in the artifacts, and a plain mv dies on the
          # directory collision ("Directory not empty").
          for a in macos-arm64 macos-x64 windows linux-x64 linux-arm64; do
            cp -R "artifacts/$a/." dist/
          done
      - name: Sign the update feed
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          # docs/UPDATE-SECURITY.md release-signing prerequisite: fail closed
          # without the correct signing secret — a release never ships
          # without its signed feed (docs/UPDATE-SECURITY.md, issue #15).
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY_B64 is missing; refusing to publish without a signed update feed" >&2
            exit 1
          fi
          KEY_DER="$RUNNER_TEMP/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          python3 scripts/check-update-signing-key.py
          bash scripts/make-update-manifest.sh "$GITHUB_REF_NAME" dist "$KEY_DER"
          rm -f "$KEY_DER"
          test -s dist/update-manifest.json
      - name: Gather + publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Keep-a-Changelog section: "## [0.1.0] - 2026-10-13" — match the
          # bracketed version followed by " - "; a trailing " .0" suffix
          # must not match "[0.1]".
          awk -v header="## [${VERSION}] - " '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || { echo "empty release notes" >&2; exit 1; }
          # Release only versioned installers, portable archives, and the
          # SBOM evidence; keep individual checksums in CI artifacts.
          cd dist
          cat *.sha256 | sed 's/ \*/  /' | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ..
          mkdir -p public
          for suffix in \
            macos-arm64.dmg macos-arm64.zip macos-x64.dmg macos-x64.zip \
            windows-x64.msi windows-x64.zip \
            linux-arm64.tar.gz linux-arm64.zip linux-x64.tar.gz linux-x64.zip \
            linux-arm64.deb linux-amd64.deb \
            linux-aarch64.AppImage linux-x86_64.AppImage \
            linux-arm64.sbom.cdx.json linux-x64.sbom.cdx.json \
            windows-x64.sbom.cdx.json \
            linux-arm64.flatpak linux-x64.flatpak; do
            name="keyward-$VERSION-$suffix"
            test -s "dist/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "dist/$name" public/
          done
          for arch in aarch64 x86_64; do
            rpm="$(find dist -maxdepth 1 -type f -name "keyward-$VERSION-*-linux-$arch.rpm" -print -quit)"
            test -s "$rpm" || { echo "::error::Missing RPM $arch"; exit 1; }
            cp "$rpm" public/
          done
          # The signed update feed rides every release (docs/UPDATE-SECURITY.md
          # release-signing prerequisite); it is not a keyward-* file so it
          # joins the inventory explicitly.
          test -s dist/update-manifest.json || { echo "::error::Missing update-manifest.json"; exit 1; }
          cp dist/update-manifest.json public/
          # Rebuild the public checksum inventory after staging, so the
          # published SBOMs are covered too (the CI sidecars cover binaries).
          # RPM revision is independent of app SemVer.
          # 17 installers/archives/SBOMs + 2 RPMs + 2 Flatpak bundles
          # + 1 signed update feed.
          test "$(find public -maxdepth 1 -type f -name 'keyward-*' | wc -l)" -eq 21
          (cd public && sha256sum keyward-* update-manifest.json | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum -c SHA256SUMS)
          test "$(wc -l < public/SHA256SUMS)" -eq 22
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Keyward $VERSION" --notes-file /tmp/notes.md
            gh release upload "$GITHUB_REF_NAME" public/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Keyward $VERSION" \
              --notes-file /tmp/notes.md \
              --latest \
              public/*
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
              fi
            done
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*
