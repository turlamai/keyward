# Flatpak bundle for the glaze carrier payload (#34 S6; portable tree:
# bin/ + lib/, the page tree assembled at runtime from define-runtime-path
# inside lib/). GNOME 50 ships WebKitGTK 4.1 (GTK3); the release workflow
# asserts it inside the Sdk before building. The release workflow stages
# flatpak-src/ from dist/ so the bundle payload is byte-identical to the
# portable tarball.
#
# CI writes the generated manifest to the repo root (see .github/workflows/
# release.yml, the Linux job's Flatpak bundle step):
#
#   flatpak-builder --user --force-clean --disable-rofiles-fuse \
#     --default-branch=stable --repo=repo build-dir site.jrtx.keyward.gen.yml
#   flatpak build-bundle repo keyward-<v>-linux-<arch>.flatpak \
#     site.jrtx.keyward stable
app-id: site.jrtx.keyward
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: keyward
# The release contract bundles from branch `stable` (build-bundle arg);
# builder otherwise commits to master.
branch: stable
separate-locales: false
finish-args:
  # prefer_xwayland_backend() picks X11 exactly when DISPLAY is set and
  # WAYLAND_DISPLAY is not; granting only the X11 socket keeps that
  # decision deterministic. dri/ipc also serve the WebKitGTK renderer's
  # compositing path.
  - --socket=x11
  - --device=dri
  - --share=ipc
  # Keyward is a file-backed vault, and every path it owns or touches is
  # a real user path, not an app-redirected one (racket/core/config.rkt,
  # racket/core/store.rkt):
  #   * the config dir is ~/.keyward (KEYWARD_CONFIG_DIR overrides);
  #   * the default store is ~/Sync/Keys/secrets.ini — the private sync
  #     folder, so a vault written inside the sandbox must land in the
  #     same file the user's other devices see, not a sandboxed copy;
  #   * snapshots go to <store-dir>/.history/keyward;
  #   * key import and the stray-key scanner open files/folders the user
  #     points at anywhere under home.
  # A portal grant would expire with the session while the persisted
  # config still names the store path, so --filesystem=home is the narrow
  # grant that keeps the vault, its history and rescans working across
  # relaunches. Keyward never talks to the OS keyring itself and never
  # writes outside these paths (SECURITY.md).
  - --filesystem=home
  # No --share=network, on purpose and doubly so here: keyward has no
  # updater at all ("a key vault does not update itself",
  # racket/update-policy.rkt — the future "Check for updates" UI takes
  # manifest bytes handed to it, it never contacts a remote), and the glaze
  # carrier opens no listener (native transport), so a sandboxed key vault
  # with network access would be a strictly larger attack surface than the
  # deb/rpm/AppImage shapes.
modules:
  - name: keyward
    buildsystem: simple
    build-commands:
      - mkdir -p /app/keyward
      - cp -a bin lib /app/keyward/
      - install -Dm755 keyward.sh /app/bin/keyward
      - install -Dm644 site.jrtx.keyward.desktop /app/share/applications/site.jrtx.keyward.desktop
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/site.jrtx.keyward.png
    sources:
      - type: dir
        path: flatpak-src
      - type: file
        path: keyward.sh
      - type: file
        path: site.jrtx.keyward.desktop
      - type: file
        path: icon-512.png
