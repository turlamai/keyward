name: glaze carrier

# keyward#34: the glaze carrier on every declared platform (owner decision
# 2026-11-23, rivet → glaze). Real-window self-check with typed evidence
# driving the production engine over rivet/bridge, the committed glaze schema
# baseline, and the typed RPC surface gate against rivet-schema.json.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GLAZE_PIN: a3faa498155a30d53f4388e88bd3e39751caaae2
  # The rivet revision the carrier's bridge and the package ship with; same
  # pin as ci.yml / packaged-smoke.yml / release.yml.
  GLAZE_RIVET_PIN: 10eb550d45f3a1be4b1608d6b0035656e1e5d7a0
  RIVET_PIN: 10eb550d45f3a1be4b1608d6b0035656e1e5d7a0
  # GPU-less hosted runners have no DRI3 device; WebKitGTK must fall back
  # to the software path or webview startup crashes (glaze docs/ci.md).
  WEBKIT_DISABLE_DMABUF_RENDERER: '1'

concurrency:
  group: host-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  surface:
    name: glaze schema baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: x64
      - name: Release identity (VERSION == version.rkt == CHANGELOG)
        run: bash scripts/check-release-version.sh
      - name: Install pinned Rivet + Glaze + crypto (catalog)
        shell: bash
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${GLAZE_RIVET_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/glaze.git#${GLAZE_PIN}"
          raco pkg install --auto --no-docs crypto
      - name: Glaze schema baseline must be committed current
        shell: bash
        run: |
          raco glaze schema write
          git diff --exit-code -- glaze-schema.json
      - name: RPC route surface vs rivet-schema.json (#34 S1)
        shell: bash
        run: python3 scripts/check-rpc-surface.py
      - name: Carrier routes carry a permission class (#34 S5)
        shell: bash
        run: python3 scripts/check-route-permissions.py
      - name: Web UI scripts parse (#34 S2/S3)
        shell: bash
        run: for f in host/web/app.js host/web/e2e.js; do node --check "$f"; done

  carrier:
    name: glaze carrier (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          # Auto-detection installs x64 on arm64 runners (Exec format error);
          # always pass the matrix architecture explicitly.
          architecture: ${{ contains(matrix.os, 'arm') && 'arm64' || 'x64' }}
      - name: Export trusted Mozilla CA roots for Windows Racket
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'keyward-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export CA roots; refusing insecure TLS fallback"
          }
          "KEYWARD_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install pinned Keel + Rivet + Glaze + crypto (Windows, verified TLS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt
      - name: Install pinned Rivet + Glaze + crypto (catalog)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${GLAZE_RIVET_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/glaze.git#${GLAZE_PIN}"
          raco pkg install --auto --no-docs crypto
      - name: Linux webview runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o DPkg::Lock::Timeout=120 -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libgtk-3-0 libwebkit2gtk-4.1-0 xvfb dbus xclip
      - name: Real-window carrier (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash host/linux-verify.sh
      - name: Real-window carrier
        if: runner.os != 'Linux'
        shell: bash
        run: racket host/verify.rkt
      - name: Upload carrier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrier-evidence-${{ matrix.os }}
          path: .glaze/verify/
          if-no-files-found: warn
