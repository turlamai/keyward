name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve main quality gates; only cancel superseded checks for the same PR.
  # A unique run ID prevents newer main pushes from cancelling earlier runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pinned so CI validates the same rivet the glaze carrier ships with (same
# pin as host-ci.yml / packaged-smoke.yml / release.yml). The glaze carrier
# itself is owned by host-ci.yml since #34 (rivet → glaze).
env:
  RIVET_PIN: 10eb550d45f3a1be4b1608d6b0035656e1e5d7a0

jobs:
  engine:
    name: Engine tests + backend compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Release preflight on every CI run: VERSION == racket/core/version.rkt
      # == CHANGELOG must hold on main, not only at release time. Runs
      # without racket, so it goes before the toolchain setup.
      - name: Verify release version alignment (VERSION == version.rkt == CHANGELOG)
        run: bash scripts/check-release-version.sh
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install deps (docs/ci.md standard; rivet pinned)
        run: raco pkg install --auto --no-docs crypto 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Engine tests
        run: raco test tests/
      - name: Backend compiles against the RVT1 contract
        run: raco make racket/backend.rkt
